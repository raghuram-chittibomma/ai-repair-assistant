[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-repair-assistant"
version = "0.1.0"
description = "Grounded AI repair assistant for household appliances, built on authoritative manufacturer documentation."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["appliance-repair", "rag", "retrieval", "whirlpool", "corpus"]

dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "click>=8.1.7",
    "pypdf>=6.0,<7",
    "pikepdf>=9.0,<11",
    # Phase 2 extractors — selected by bake-off (see ADR-0007 / evals/parsing).
    "pdfplumber>=0.11,<0.12",
    "pymupdf>=1.24,<1.29",
    # Phase 3 ingestion (ADR-0008 / ADR-0009).
    "psycopg[binary]>=3.2,<4",
    # Local OSS embeddings — OpenAI is reserved for LLM inference later.
    "sentence-transformers>=3.0,<5",
    # Phase 5 grounded Q&A (charter Phase 6).
    "openai>=1.40,<3",
    # Phase 6 LangGraph diagnostics (charter Phase 7).
    "langgraph>=0.2,<2",
    "langchain-core>=0.3,<2",
    # Phase 9 HTTP API (charter Phase 10).
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    # Phase 9 observability (ADR-0018) — opt-in via LANGFUSE_* env vars.
    # v4+ required for Python 3.14+ (v3 hits pydantic.v1 import errors).
    "langfuse>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]
# Experimental PDF extractor for parse bake-offs (ADR-0007 follow-on).
# Not required for default pdfplumber parsing.
docling = [
    "docling>=2.0,<3",
]

[project.scripts]
repair-corpus = "repair_assistant.corpus.cli:main"
repair-assistant-api = "repair_assistant.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/repair_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"src/repair_assistant/prompts" = "repair_assistant/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
