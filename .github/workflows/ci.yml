name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install from the lockfile
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Validate the corpus manifest
        run: uv run repair-corpus validate

      - name: Tests
        run: uv run pytest -q

      - name: A clean clone must report exactly what is missing
        run: uv run repair-corpus status

  copyright-guard:
    # The licensing guarantee in docs/CORPUS_LICENSING.md, enforced. A README
    # warning is not a control; this job is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No manufacturer document artefacts may be committed
        run: |
          set -euo pipefail
          found=$(git ls-files \
            | grep -Ei '\.(pdf|docx?)$|^corpus/(documents|_staging|snapshots)/' \
            | grep -v '^corpus/documents/README\.md$' \
            || true)
          if [ -n "$found" ]; then
            echo "::error::Manufacturer document artefacts found in the repository:"
            echo "$found"
            echo "These are copyrighted and must never be committed."
            echo "See docs/CORPUS_LICENSING.md."
            exit 1
          fi
          echo "No document artefacts in the tree."

      - name: The corpus document directory must hold nothing but its README
        run: |
          set -euo pipefail
          extra=$(git ls-files corpus/documents | grep -v '^corpus/documents/README\.md$' || true)
          if [ -n "$extra" ]; then
            echo "::error::corpus/documents must contain no tracked files besides README.md."
            echo "$extra"
            exit 1
          fi
          echo "corpus/documents holds only its README, as intended."
