<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Repair Assistant</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --warn: #ffb020;
      --danger: #ff6b6b;
      --border: #2a3544;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: baseline;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    header p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.85rem; }
    header .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    main {
      flex: 1;
      max-width: 52rem;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 0.75rem;
      align-items: end;
    }
    .controls-secondary {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 0.75rem;
      align-items: end;
    }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, select, button, textarea {
      width: 100%;
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0.55rem 0.75rem;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
      width: auto;
      min-width: 5.5rem;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    button.secondary { background: transparent; border-color: var(--border); color: var(--text); }
    button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    #sessionBar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.25rem;
    }
    #sessionBar .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
    }
    #sessionBar .pill.active { border-color: #35507a; color: var(--text); }
    #log {
      flex: 1;
      min-height: 18rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.user { border-color: #35507a; }
    .msg.assistant { border-color: #2a4a3a; }
    .msg.system { color: var(--muted); font-size: 0.85rem; border-style: dashed; }
    .msg.hit { border-color: #3a4560; font-size: 0.9rem; }
    .msg.abstain { border-color: var(--warn); }
    .msg.safety { border-color: var(--danger); }
    .msg.pending { border-style: dashed; color: var(--muted); }
    .msg .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.55rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.abstain { color: var(--warn); border-color: var(--warn); }
    .badge.safety { color: var(--danger); border-color: var(--danger); }
    .badge.escalate { color: var(--warn); border-color: var(--warn); }
    .badge.hit { color: var(--accent); border-color: var(--accent); }
    .reason {
      margin-top: 0.55rem;
      padding-top: 0.55rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .cites { margin-top: 0.65rem; font-size: 0.8rem; color: var(--muted); }
    .cites span { display: block; }
    .composer { display: flex; gap: 0.5rem; align-items: flex-end; }
    .composer textarea { min-height: 3.2rem; resize: vertical; flex: 1; }
    .composer .btns { display: flex; flex-direction: column; gap: 0.4rem; }
    .status { font-size: 0.8rem; color: var(--muted); }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .status.busy { color: var(--warn); }
    .dots::after {
      content: "";
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    @media (max-width: 720px) {
      .controls, .controls-secondary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI Repair Assistant</h1>
      <p>Grounded Q&amp;A over manufacturer docs — LAN only (WFW5620H family)</p>
    </div>
    <div class="actions">
      <button type="button" id="exportJson" class="secondary" title="Download chat history as JSON">Export JSON</button>
      <button type="button" id="exportMd" class="secondary" title="Download chat history as Markdown">Export MD</button>
    </div>
  </header>
  <main>
    <div class="controls">
      <div>
        <label for="model">Model</label>
        <input id="model" value="WFW5620HW0" autocomplete="off" />
      </div>
      <div>
        <label for="serial">Serial (optional)</label>
        <input id="serial" placeholder="e.g. CF82012345" autocomplete="off" />
      </div>
      <div>
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="ask">Ask (streaming)</option>
          <option value="diagnose">Diagnostic chat (streaming)</option>
          <option value="search">Search only</option>
        </select>
      </div>
      <div>
        <button type="button" id="newSession" class="secondary" title="Clear chat / start a new diagnostic session">New chat</button>
      </div>
    </div>
    <div class="controls-secondary">
      <div>
        <label for="audience">Audience</label>
        <select id="audience">
          <option value="owner">Owner</option>
          <option value="technician">Technician</option>
        </select>
      </div>
      <div id="sessionBar" aria-live="polite"></div>
    </div>
    <div id="status" class="status">Checking API…</div>
    <div id="log" aria-live="polite"></div>
    <form class="composer" id="form">
      <textarea id="input" rows="2" placeholder="Ask a repair question…" required></textarea>
      <div class="btns">
        <button type="submit" id="send">Send</button>
        <button type="button" id="cancel" class="danger" disabled title="Cancel in-flight request">Cancel</button>
      </div>
    </form>
  </main>
  <script>
    const log = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const modelEl = document.getElementById("model");
    const serialEl = document.getElementById("serial");
    const modeEl = document.getElementById("mode");
    const audienceEl = document.getElementById("audience");
    const sendBtn = document.getElementById("send");
    const cancelBtn = document.getElementById("cancel");
    const newSessionBtn = document.getElementById("newSession");
    const sessionBar = document.getElementById("sessionBar");
    const exportJsonBtn = document.getElementById("exportJson");
    const exportMdBtn = document.getElementById("exportMd");

    const FETCH_TIMEOUT_MS = 180000;

    let sessionId = null;
    let turn = 0;
    let busy = false;
    let pendingEl = null;
    let embedderWarm = false;
    let abortController = null;
    /** @type {{ts:string, role:string, mode:string, text:string, citations?:any[], meta?:object}[]} */
    let history = [];

    function authHeaders(extra = {}) {
      return { ...extra };
    }

    function errorDetail(data, fallback) {
      if (!data || data.detail == null) return fallback;
      const d = data.detail;
      if (typeof d === "string") return d;
      if (Array.isArray(d)) return d.map((item) => item.msg || JSON.stringify(item)).join("; ");
      return String(d);
    }

    function record(role, text, extra = {}) {
      history.push({
        ts: new Date().toISOString(),
        role,
        mode: modeEl.value,
        text,
        ...extra,
      });
    }

    function download(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportJson() {
      download(
        `repair-chat-${Date.now()}.json`,
        JSON.stringify({ exported_at: new Date().toISOString(), messages: history }, null, 2),
        "application/json"
      );
    }

    function exportMd() {
      const lines = ["# AI Repair Assistant chat", "", `Exported: ${new Date().toISOString()}`, ""];
      for (const m of history) {
        lines.push(`## ${m.role} (${m.mode})`, "", m.text || "", "");
        if (m.citations && m.citations.length) {
          for (const c of m.citations) {
            lines.push(`- [${c.index}] ${c.label} — ${c.doc_id}`);
          }
          lines.push("");
        }
      }
      download(`repair-chat-${Date.now()}.md`, lines.join("\n"), "text/markdown");
    }

    function updateSessionBar() {
      const mode = modeEl.value;
      if (mode === "ask") {
        sessionBar.innerHTML = `<span class="pill">Ask — answers stream token-by-token</span>`;
        return;
      }
      if (mode === "search") {
        sessionBar.innerHTML = `<span class="pill">Search — retrieval hits only (no LLM)</span>`;
        return;
      }
      if (sessionId) {
        sessionBar.innerHTML =
          `<span class="pill active">Diagnostic session active</span>` +
          `<span class="pill">Turn ${turn}</span>` +
          `<span class="pill">Replies stream token-by-token</span>` +
          `<span class="pill" title="${sessionId}">Session …${sessionId.slice(-8)}</span>`;
      } else {
        sessionBar.innerHTML = `<span class="pill">Diagnostic chat — replies stream; next send starts a session</span>`;
      }
    }

    function updatePlaceholder() {
      const mode = modeEl.value;
      input.placeholder =
        mode === "diagnose"
          ? "Describe the symptom or reply with what you observed…"
          : mode === "search"
            ? "Search the corpus (e.g. F5E2 door lock)…"
            : "Ask a repair question…";
    }

    function append(role, text, opts = {}) {
      const {
        citations = [],
        abstained = false,
        abstainReason = "",
        safetyAction = "allow",
        safetyNotice = "",
        escalated = false,
        pending = false,
        hit = false,
        score = null,
      } = opts;
      const div = document.createElement("div");
      const classes = ["msg", role];
      if (abstained) classes.push("abstain");
      if (safetyAction === "block" || safetyAction === "escalate" || escalated) classes.push("safety");
      if (pending) classes.push("pending");
      if (hit) classes.push("hit");
      div.className = classes.join(" ");

      const badges = [];
      if (hit) badges.push(["hit", score != null ? `score ${Number(score).toFixed(3)}` : "hit"]);
      if (abstained) badges.push(["abstain", "Abstained"]);
      if (safetyAction === "block") badges.push(["safety", "Blocked"]);
      else if (safetyAction === "escalate" || escalated) badges.push(["escalate", "Escalated"]);
      if (badges.length) {
        const meta = document.createElement("div");
        meta.className = "meta";
        for (const [cls, label] of badges) {
          const b = document.createElement("span");
          b.className = "badge " + cls;
          b.textContent = label;
          meta.appendChild(b);
        }
        div.appendChild(meta);
      }

      const body = document.createElement("div");
      body.className = "body";
      if (pending) body.innerHTML = `<span class="dots">${text}</span>`;
      else body.textContent = text;
      div.appendChild(body);

      if (abstained && abstainReason) {
        const r = document.createElement("div");
        r.className = "reason";
        r.textContent = "Why: " + abstainReason;
        div.appendChild(r);
      }
      if (safetyNotice) {
        const r = document.createElement("div");
        r.className = "reason";
        r.textContent = safetyNotice;
        div.appendChild(r);
      }
      if (citations.length) {
        const cites = document.createElement("div");
        cites.className = "cites";
        citations.forEach((c) => {
          const line = document.createElement("span");
          const page = c.page != null ? ` p.${c.page}` : "";
          line.textContent = `[${c.index}] ${c.label}${page} — ${c.doc_id}`;
          cites.appendChild(line);
        });
        div.appendChild(cites);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function setBusy(on, hint) {
      busy = on;
      sendBtn.disabled = on;
      cancelBtn.disabled = !on;
      input.disabled = on;
      modeEl.disabled = on;
      newSessionBtn.disabled = on;
      if (on) {
        statusEl.textContent = hint || "Working…";
        statusEl.className = "status busy";
      }
    }

    function showPending(text) {
      removePending();
      pendingEl = append("assistant", text, { pending: true });
    }

    function removePending() {
      if (pendingEl) {
        pendingEl.remove();
        pendingEl = null;
      }
    }

    async function checkHealth() {
      try {
        const r = await fetch("/ready");
        if (!r.ok) throw new Error("not ready");
        const data = await r.json().catch(() => ({}));
        embedderWarm = data.embedder === "loaded";
        const emb = embedderWarm ? "embedder warm" : "embedder cold";
        const sess = typeof data.sessions === "number" ? `; ${data.sessions} session(s)` : "";
        statusEl.textContent = `API ready (${emb}${sess})`;
        statusEl.className = "status ok";
      } catch {
        statusEl.textContent = "API not ready — is the server running with DATABASE_URL set?";
        statusEl.className = "status err";
      }
    }

    async function endServerSession() {
      if (!sessionId) return;
      try {
        await fetch("/v1/diagnose/" + encodeURIComponent(sessionId), {
          method: "DELETE",
          headers: authHeaders(),
        });
      } catch { /* best-effort */ }
    }

    async function resetChat({ announce } = { announce: true }) {
      if (abortController) abortController.abort();
      await endServerSession();
      sessionId = null;
      turn = 0;
      history = [];
      log.innerHTML = "";
      updateSessionBar();
      if (announce) {
        const mode = modeEl.value;
        const msg =
          mode === "diagnose"
            ? "New diagnostic session. Describe the symptom to begin. Sessions are in-memory and expire after idle time or API restart."
            : mode === "search"
              ? "Search mode — shows retrieval hits without calling the LLM."
              : "Chat cleared. Ask answers stream as they generate.";
        append("system", msg);
        record("system", msg);
      }
    }

    function parseSseChunk(buffer) {
      const events = [];
      const parts = buffer.split("\n\n");
      const rest = parts.pop() || "";
      for (const part of parts) {
        for (const line of part.split("\n")) {
          if (line.startsWith("data: ")) {
            try {
              events.push(JSON.parse(line.slice(6)));
            } catch { /* ignore partial */ }
          }
        }
      }
      return { events, rest };
    }

    async function consumeSse(url, body, onEvent) {
      abortController = new AbortController();
      const timer = setTimeout(() => abortController.abort(), FETCH_TIMEOUT_MS);
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json", Accept: "text/event-stream" }),
          body: JSON.stringify(body),
          signal: abortController.signal,
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          const err = new Error(errorDetail(data, res.statusText));
          err.status = res.status;
          throw err;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parsed = parseSseChunk(buf);
          buf = parsed.rest;
          for (const ev of parsed.events) onEvent(ev);
        }
      } finally {
        clearTimeout(timer);
        abortController = null;
      }
    }

    function handleStreamStatus(ev) {
      const phase = ev.phase === "generating"
        ? `Generating (${ev.retrieval_count || 0} hits)…`
        : "Retrieving…";
      statusEl.textContent = phase;
      statusEl.className = "status busy";
      if (pendingEl) {
        pendingEl.querySelector(".body").innerHTML = `<span class="dots">${phase}</span>`;
      }
    }

    function finalizeStreamMessage(ev, assembled, streamEl) {
      removePending();
      const answer = ev.answer || ev.assistant_message || assembled || "";
      if (streamEl) {
        streamEl.remove();
        streamEl = null;
      }
      append("assistant", answer || "(empty response)", {
        citations: ev.citations || [],
        abstained: !!ev.abstained,
        abstainReason: ev.abstain_reason || "",
        safetyAction: ev.safety_action || "allow",
        safetyNotice: ev.safety_notice || "",
        escalated: !!ev.escalated,
      });
      record("assistant", answer, {
        citations: ev.citations || [],
        meta: {
          abstained: !!ev.abstained,
          safety_action: ev.safety_action,
          retrieval_count: ev.retrieval_count,
        },
      });
      embedderWarm = true;
      const code = ev.abstain_code || "";
      statusEl.textContent = code === "unsupported_model"
        ? "Model not covered by this documentation"
        : ev.abstained
          ? "Abstained — see reason above"
          : "API ready (embedder warm)";
      statusEl.className = ev.abstained ? "status busy" : "status ok";
      return { answer, streamEl };
    }

    async function runAskStream(text, model, serial, audience) {
      const body = { question: text, model, audience };
      if (serial) body.serial = serial;
      showPending(embedderWarm ? "Retrieving…" : "Retrieving (embeddings may still be warming)…");
      let streamEl = null;
      let assembled = "";
      await consumeSse("/v1/ask/stream", body, (ev) => {
        if (ev.type === "status") handleStreamStatus(ev);
        else if (ev.type === "token") {
          if (!streamEl) {
            removePending();
            streamEl = append("assistant", "");
          }
          assembled += ev.text || "";
          streamEl.querySelector(".body").textContent = assembled;
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === "error") {
          throw new Error(ev.detail || "stream error");
        } else if (ev.type === "done") {
          ({ streamEl } = finalizeStreamMessage(ev, assembled, streamEl));
        }
      });
    }

    async function runDiagnoseStream(text, model, serial, audience) {
      const body = { message: text, model, audience };
      if (serial) body.serial = serial;
      if (sessionId) body.session_id = sessionId;
      showPending(embedderWarm ? "Retrieving…" : "Retrieving (embeddings may still be warming)…");
      let streamEl = null;
      let assembled = "";
      try {
        await consumeSse("/v1/diagnose/stream", body, (ev) => {
          if (ev.type === "status") handleStreamStatus(ev);
          else if (ev.type === "token") {
            if (!streamEl) {
              removePending();
              streamEl = append("assistant", "");
            }
            assembled += ev.text || "";
            streamEl.querySelector(".body").textContent = assembled;
            log.scrollTop = log.scrollHeight;
          } else if (ev.type === "error") {
            throw new Error(ev.detail || "stream error");
          } else if (ev.type === "done") {
            if (ev.session_id) sessionId = ev.session_id;
            if (typeof ev.turn === "number") turn = ev.turn;
            updateSessionBar();
            ({ streamEl } = finalizeStreamMessage(ev, assembled, streamEl));
          }
        });
      } catch (err) {
        if (err.status === 410 || (err.message && err.message.toLowerCase().includes("expired"))) {
          sessionId = null;
          turn = 0;
          updateSessionBar();
          throw new Error(
            err.message +
              " — start a new chat (diagnose sessions are not kept across API restarts)."
          );
        }
        throw err;
      }
    }

    async function runSearch(text, model, serial) {
      const body = { query: text, model };
      if (serial) body.serial = serial;
      abortController = new AbortController();
      const timer = setTimeout(() => abortController.abort(), FETCH_TIMEOUT_MS);
      showPending("Searching corpus…");
      try {
        const res = await fetch("/v1/search", {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(body),
          signal: abortController.signal,
        });
        const data = await res.json().catch(() => ({}));
        removePending();
        if (!res.ok) throw new Error(errorDetail(data, res.statusText));
        if (data.notice) {
          append("assistant", data.notice, {
            abstained: true,
            abstainReason: data.abstain_code === "unsupported_model"
              ? "Model not covered by our documentation set."
              : "",
          });
          record("assistant", data.notice, { meta: { abstain_code: data.abstain_code } });
          statusEl.textContent = "Model not covered by this documentation";
          statusEl.className = "status busy";
          return;
        }
        const hits = data.hits || [];
        if (!hits.length) {
          append("system", "No hits.");
          record("system", "No hits.");
        } else {
          for (const h of hits) {
            const label = [h.publication_number || h.doc_id, h.page != null ? `p.${h.page}` : null]
              .filter(Boolean)
              .join(" ");
            const textOut = `${label}\n${h.text || ""}`;
            append("assistant", textOut, { hit: true, score: h.score });
            record("hit", textOut, { meta: { doc_id: h.doc_id, score: h.score, page: h.page } });
          }
        }
        embedderWarm = true;
        statusEl.textContent = `Search done — ${hits.length} hit(s); fetched ${data.fetched || 0}`;
        statusEl.className = "status ok";
      } finally {
        clearTimeout(timer);
        abortController = null;
      }
    }

    modeEl.addEventListener("change", async () => {
      updatePlaceholder();
      await resetChat({ announce: true });
      await checkHealth();
    });

    newSessionBtn.addEventListener("click", async () => {
      if (busy) return;
      await resetChat({ announce: true });
      await checkHealth();
      input.focus();
    });

    cancelBtn.addEventListener("click", () => {
      if (abortController) abortController.abort();
    });

    exportJsonBtn.addEventListener("click", exportJson);
    exportMdBtn.addEventListener("click", exportMd);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (busy) return;
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      append("user", text);
      record("user", text);
      setBusy(true, "Working…");
      const model = modelEl.value.trim();
      const serial = serialEl.value.trim() || null;
      const audience = audienceEl.value;
      const mode = modeEl.value;
      try {
        if (mode === "search") await runSearch(text, model, serial);
        else if (mode === "diagnose") await runDiagnoseStream(text, model, serial, audience);
        else await runAskStream(text, model, serial, audience);
      } catch (err) {
        removePending();
        const msg =
          err && err.name === "AbortError"
            ? "Cancelled."
            : "Error: " + (err.message || String(err));
        append("system", msg);
        record("system", msg);
        statusEl.textContent = err && err.name === "AbortError" ? "Cancelled" : "Request failed";
        statusEl.className = "status err";
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    updatePlaceholder();
    updateSessionBar();
    checkHealth();
    input.focus();
  </script>
</body>
</html>
