corpus:
  role: applicable
  rationale: >-
    The corpus's central precedence case. A two-page informational bulletin that
    overrides a specific passage of a 100-plus-page service manual for the anchor
    model. Any system that ranks by semantic similarity alone will prefer the
    manual, and be wrong. Also demonstrates that a document can carry maximum
    applicability breadth (all serial numbers, 23 models) and still be narrow in
    what it asserts.
