  rationale: >-
    The third member of the F5E2 set. Attributes the code to a door switch and
    ends with "If the error code returns, schedule service". Included because two
    distractors are meaningfully harder than one: a system can accidentally get a
    binary choice right, and three-way disambiguation exposes whether category
    filtering is actually happening or a coin was flipped.
