  rationale: >-
    A multi-hop case. The stated symptom is a motor speed sensing error, which
    reads like a component failure, but the documented cause is that all four
    shipping bolts were not removed at installation. Answering it well requires
    combining this article, the tech sheet's TEST #3, and the installation
    instructions - so it tests whether retrieval can assemble evidence across
    document types rather than returning one good chunk.
