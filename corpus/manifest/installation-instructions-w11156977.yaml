  rationale: >-
    Several real faults on this platform are installation faults, not component
    failures: shipping bolts left in place cause the F7 E1 motor speed error, and
    drain hose height and insertion depth drive F9 E1 long-drain and siphoning
    complaints. Diagnosing those correctly requires installation content, so the
    corpus would have a genuine hole without it.
