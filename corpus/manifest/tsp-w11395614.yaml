corpus:
  role: distractor
  rationale: >-
    Present precisely because it is wrong for the anchor model. It is a Whirlpool
    front-load washer bulletin describing a door that locks but will not start,
    tumble or spin - which is close to how a WFW5620HW0 owner would describe a
    real symptom - yet it applies only to 24-inch models within three explicit
    serial ranges. Retrieving it for a WFW5620HW0 question is a failure regardless
    of semantic similarity. Provides the corpus's only concrete serial-range
    boundaries, so it also anchors the serial containment tests.
