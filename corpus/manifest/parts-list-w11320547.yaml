  rationale: >-
    Supplies exploded views and part numbers, and enumerates the literature
    package for the anchor model. It also carries a known hazard that the corpus
    must represent honestly: its part numbers are current as of 2020 and several
    have since superseded (door lock W10804741 now supersedes to W11565030,
    pressure switch W11125159 to W11316246, control panel W11294803 to
    W11319991). Grounding a part recommendation solely in this document produces
    a confidently wrong answer, and no first-party supersession feed was found.
    Tracked as an evaluation scenario and a Phase 6 risk.
