# Retrieval bake-off fixtures (charter D4 / Phase 4 practice).
# Graded on publication_number or doc_id appearing in top-K hits after retrieval.
# Requires a live Postgres with ingested embeddings (repair-corpus ingest --all).
#
# Pass/fail uses must_cite / must_cite_any / must_not_cite.
# Diagnostic IR metrics (Hit@K, Recall@K, Precision@K, MRR, nDCG@K) use the
# same labels (or an optional explicit `relevant:` list). See docs/EVALS.md.
#
# S4 decision set: these 18 fixtures are `split: dev` by default. A separate
# held-out test set was waived; drafts live in evals/retrieval/drafts/.
#
# Synthetic docs (doc_id / publication SYNTH-*) live under
# evals/retrieval/synthetic/ and are eval-only. They are never under
# corpus/documents/ or corpus/manifest/. Production search excludes them.

version: 1
k: 8

strategies:
  - id: vector_raw
    description: Cosine neighbours only (no applicability filter)
  - id: vector_apply
    description: Vector + applicability drop (no authority boosts)
  - id: vector_apply_boost
    description: ADR-0010 interim — vector + apply + light boosts
  - id: vector_apply_rerank
    description: >-
      ADR-0027 bake-off — vector + apply + cross-encoder, no authority boosts.
      Not used by production search().
  - id: lexical_apply
    description: Postgres full-text + applicability drop
  - id: hybrid_rrf_apply
    description: RRF fusion of vector + lexical, then applicability
  - id: union_lexical_apply
    description: Vector ∪ OR-semantics full-text, magnitude preserved, then apply + boosts
  - id: union_literal_apply
    description: Vector ∪ rare-literal exact match, magnitude preserved, then apply + boosts
  - id: production_search
    description: >-
      Production search() path (code + connector + reference + manual_rev side
      doors + vector), then apply + boosts. Grades what ask/diagnose actually run.

fixtures:
  # --- Core (kept hard) ----------------------------------------------------

  - id: acu-led-step-10
    family: precedence-bulletin-over-manual
    question: >-
      On a WFW5620HW0, what should the ACU diagnostic LED do during the ACU
      power check?
    appliance: {model: WFW5620HW0}
    must_cite: [W11375982]
    hard: true

  - id: door-locks-wont-run-wrong-platform
    family: applicability-serial-range
    question: My Whirlpool front load washer locks the door but won't start.
    appliance: {model: WFW5620HW0}
    must_not_cite: [W11395614]
    hard: true

  - id: f5e2-front-load-not-top-load
    family: applicability-product-category
    question: What does error code F5E2 mean on my front-load washer?
    appliance: {model: WFW5620HW0}
    must_cite: [kb-f5e2-front-load]
    must_not_cite: [kb-f5e2-top-load, kb-f5e2-laundry-tower]
    hard: true

  - id: error-code-f6e1
    family: retrieval-exact-identifier
    question: What is F6E1?
    appliance: {model: WFW5620HW0}
    must_cite_any: [W11320651, W11156989]
    hard: true

  - id: connector-j36-motor-harness
    family: retrieval-exact-identifier
    question: What connects to J36 on the ACU?
    appliance: {model: WFW5620HW0}
    must_cite: [W11169652]
    must_not_cite: [W11395614]
    hard: true

  - id: part-number-door-lock
    family: retrieval-exact-identifier
    question: Is part number W10804741 the door lock for my washer?
    appliance: {model: WFW5620HW0}
    must_cite: [W11320547]
    hard: true

  - id: transport-bolt-vocabulary
    family: retrieval-term-mismatch
    question: >-
      My newly installed washer shakes violently during the spin cycle. Did I
      forget to remove the shipping bolts?
    appliance: {model: WFW5620HW0}
    must_cite: [W11156977]
    hard: true

  # --- Soft / demoted (exact-id budget) ------------------------------------

  - id: serial-inside-door-lock-tsp
    family: applicability-serial-range
    question: Does the door-lock service pointer apply to my machine?
    appliance: {model: WFW3090GW2, serial: CF83000000, model_introduced: 2018}
    must_cite: [W11395614]
    hard: false

  - id: serial-outside-door-lock-tsp
    family: applicability-serial-range
    question: Does the door-lock service pointer apply to my machine?
    appliance: {model: WFW3090GW2, serial: CF84900000, model_introduced: 2018}
    must_not_cite: [W11395614]
    hard: false

  - id: part-number-pressure-switch
    family: retrieval-exact-identifier
    question: What component is part W11125159 on a WFW5620HW0?
    appliance: {model: WFW5620HW0}
    must_cite: [W11320547]
    hard: false
    note: Demoted 2026-08-26 — near-duplicate of part-number-door-lock.

  - id: test-10a-measured-values
    family: retrieval-exact-identifier
    question: What are the measured values in TEST #10a?
    appliance: {model: WFW5620HW0}
    must_cite_any: [W11320651, W11156989]
    hard: false
    note: Softened 2026-08-26 — overlaps exact-id budget; F6E1 is the harder orphan.

  # --- Expansion (ready-now on held corpus) --------------------------------
  # From fixture-spread research: break the 9/9 leader tie; close applicability
  # edges the corpus already holds. See docs/adr/0020 and coverage canvas.

  - id: tech-sheet-page1-by-pub
    family: near-duplicate-tech-sheets
    question: What does the safety notice on page 1 of W11320651 say?
    appliance: {model: WFW5620HW0}
    # Page 1 of W11320651 and W11156989 are word-for-word twins except the pub #.
    must_cite: [W11320651]
    must_not_cite: [W11156989]
    hard: true

  - id: manual-rev-b-acu-led
    family: precedence-revision
    question: >-
      What does revision B of the service manual say about the ACU diagnostic
      LED?
    appliance: {model: WFW5620HW0}
    # Both revs share publication_number W11169652; grade by doc_id.
    must_cite: [service-manual-w11169652-revb]
    hard: true

  - id: f5e2-tech-sheet-not-kb
    family: authority-depth
    question: >-
      F5 E2 on a WFW5620HW0 - the door will not lock. What should I check?
    appliance: {model: WFW5620HW0}
    must_cite: [W11320651]
    must_not_cite: [kb-f5e2-front-load]
    hard: true

  - id: publication-what-is-w11375982
    family: retrieval-bibliographic
    question: What is W11375982?
    must_cite: [W11375982]
    hard: true

  - id: adjacent-model-parts-exclude
    family: applicability-engineering-digit
    question: Is W11320547 the parts list for my WFW5622HW0?
    appliance: {model: WFW5622HW0}
    # Parts list is scoped to exact WFW5620HW0 only; adjacent base must drop.
    must_not_cite: [W11320547]
    hard: true

  - id: maytag-mhw-platform-manual
    family: applicability-multi-brand
    question: What service manual covers my Maytag MHW5630HW0?
    appliance: {model: MHW5630HW0}
    must_cite: [W11169652]
    must_not_cite: [W11533288, W11766193]
    hard: true

  # --- Synthetic eval-only (not OEM literature) ----------------------------
  # Files under evals/retrieval/synthetic/. Ingested only for bench-retrieve.
  # Production search excludes doc_id synth-* / publication SYNTH-*.

  - id: synth-owners-manual-supersession
    family: precedence-supersession
    source: synthetic
    question: What does the owner's manual say about cleaning the washer drum?
    appliance: {model: WFW5620HW0}
    must_cite: [SYNTH-UC-200]
    must_not_cite: [SYNTH-UC-100]
    hard: true
    note: >-
      Synthetic stand-in for blocked W11355369 supersession. Both pubs apply to
      the same model; only the manifest supersedes edge selects the current one.
