# Hand-run smoke scenarios for Phase 5 grounded Q&A.
#
# Run manually after ingest + OPENAI_API_KEY are configured. These are not CI
# tests — they record expected behaviour for informal regression checks until
# the Phase 9 answer eval harness exists.
#
# Example (Windows):
#   python -m repair_assistant.corpus.cli ask "..." --model WFW5620HW0
#
# Log results under evals/qa/results/ with date and pass/fail notes.

version: 1
anchor_model: WFW5620HW0

scenarios:
  - id: f5e2-meaning
    command: ask
    question: What does F5E2 mean?
    appliance: {model: WFW5620HW0}
    expect_contains:
      - door lock
    expect_cites_any:
      - W11169652
      - W11320651
      - W11156989
    notes: >-
      Door-lock failure, not lid switch (front-load). Should cite applicable
      tech sheet or service manual rows.

  - id: f5e2-door-locks-wont-start
    command: diagnose
    turns:
      - My washer shows F5E2 and the door locks but it won't start.
      - The door seems fully closed.
    appliance: {model: WFW5620HW0}
    turn_grades:
      1:
        expect_contains: [F5E2]
        expect_cites_any: [W11169652, W11320651, W11156989, kb-f5e2-front-load]
        must_not_cite: [W11395614]
        fails_if_contains: [lid]
      2:
        expect_contains_any: ["test #4", "door lock", switch, strike, latch]
        must_not_cite: [W11395614]
        fails_if_contains: [lid]
    notes: >-
      Multi-turn: first turn should ground in door-lock evidence; second turn
      should narrow checks without citing W11395614 (24in wrong platform).

  - id: acu-led-step-10
    command: ask
    question: >-
      On a WFW5620HW0, what should the ACU diagnostic LED do during the ACU
      power check?
    appliance: {model: WFW5620HW0}
    expect_cites_any:
      - W11375982
    expect_contains:
      - blink
    notes: >-
      Bulletin precedence case — slow blink is a pass, not a fault. Grade
      direction of conclusion, not just presence of timings.

  - id: door-locks-wont-run-no-wrong-bulletin
    command: ask
    question: My Whirlpool front load washer locks the door but won't start.
    appliance: {model: WFW5620HW0}
    must_not_cite:
      - W11395614
    notes: >-
      Applicability filter must exclude 24in-only bulletin even if semantically
      similar.

  - id: unknown-error-abstain
    command: ask
    question: What does error code ZZ99 mean?
    appliance: {model: WFW5620HW0}
    expect_abstain: true
    notes: Fabricated code — should abstain or say evidence lacks ZZ99.

  - id: mid-cycle-stop-diag-entry
    command: diagnose
    turns:
      - >-
        stops after 10 minutes of running without finishing the wash.
        no error code on the display.
    appliance: {model: WFW5620HW0}
    turn_grades:
      1:
        expect_cites_any: [W11169652]
        expect_contains_any:
          - Service Diagnostic
          - "diagnostic mode"
          - "888"
          - "three (3) buttons"
          - "three buttons"
        fails_if_contains:
          - cycle selector
          - 'Off" position'
          - 'to "Normal"'
    notes: >-
      Mid-cycle / no-code stop should quote Activating Service Diagnostic Mode
      from the service manual (W11169652), not invent a knob sequence.

  - id: door-got-locked-unlock
    command: ask
    question: door got locked
    appliance: {model: WFW5620HW0}
    expect_contains_any: [unlock, open, "Add Garment", "start/pause", pause]
    fails_if_contains:
      - "won't lock"
      - "will not lock"
      - "Ensure that door is completely closed"
    expect_cites_any: [W11156985, W11169652, W11320651, W11156989]
    notes: >-
      Unlock polarity — stuck-closed guidance, not "door won't lock" start checks.

  - id: door-lock-underspecified-clarify
    command: ask
    question: door lock problem
    appliance: {model: WFW5620HW0}
    expect_contains_any:
      - stuck
      - unlock
      - lock
      - F5E2
      - open
      - closed
    fails_if_contains:
      - "replace the door lock"
      - "test #4"
      - "TEST #4"
    notes: >-
      Underspecified door/lock — ask path should clarify polarity, not jump to
      a repair procedure.
