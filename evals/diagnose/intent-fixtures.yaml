# Gold labels for diagnose turn-2+ classify (ADR-0039 / ADR-0054).
#
# Manual bench: repair-corpus bench-diagnose-intent [--write]
# Each case is board + transcript → expected closed-set label.
# Not CI. Not mined into live fixtures automatically (ADR-0023).

version: 1

fixtures:
